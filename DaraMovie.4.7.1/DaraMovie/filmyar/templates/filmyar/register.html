{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static "styles/basics.css" %}">
    <link rel="stylesheet" href="{% static "styles/loginRegister.css" %}">
    
    <title>Login</title>

</head>
<body>
    
    <!-- register box -->
    <div class="the-container">
        <div class="register-box">
            <div class="box-header">
                <span class="headerr">Register</span>
                {% if error_message %}
                <div class="alert alert-danger" role="alert">{{ error_message }}</div>
                {% endif %}
            </div>
            <div class="box-body">
                <form method="post">
                {% csrf_token %}

                <div class="form-input">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
            
                <div class="form-input">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" required>
                </div>
            
                <div class="form-input">
                    <label for="password1">Password</label>
                    <input type="text" id="password1" name="password1" required>
                </div>
            
                <div class="form-input">
                    <label for="password2">Repeat Password</label>
                    <input type="text" id="password2" name="password2" required>
                </div>
                <button type="submit">Register</button>
            </form>
            </div>
        </div>
    </div>



</body>
</html>
