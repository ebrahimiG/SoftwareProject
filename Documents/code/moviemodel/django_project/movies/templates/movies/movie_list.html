{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>movie list</title>
</head>
<body>
    <h1>this is the movie list for winter 2020</h1>
    <hr>
    <ul>
        {% for movie in movies %}
        <li>{{ movie }} :: 
            {% for genre in movie.genres.all %} 
            {{genre.name}} {% if not forloop.last %},{% endif %}
            {% endfor %} ::
            {{movie.summery}} :: 
            {{movie.rate}}
        </li> 
        {% endfor %}
    </ul>
</body>
</html>
